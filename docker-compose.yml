services:
  db:
    image: postgres:15-alpine
    container_name: weblab_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: weblab_app
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      - db

  backend-tests:
    image: eclipse-temurin:17-jdk-jammy
    container_name: weblab_junit
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
    command: ./gradlew cleanTest test -x nodeSetup -x npmInstallTask -x buildFrontend --no-daemon

  team-task:
    image: gradle:8.7-jdk17
    container_name: weblab_team
    volumes:
      - .:/app
    working_dir: /app
    command: ./gradlew labTeam --no-daemon

  e2e-tests:
    image: cypress/included:15.16.0
    container_name: weblab_e2e
    volumes:
      - ./src/main/frontend/cypress:/e2e-tests/cypress
      - ./src/main/frontend/cypress.config.js:/e2e-tests/cypress.config.js
    working_dir: /e2e-tests
    environment:
      - CYPRESS_baseUrl=http://app:8080
    depends_on:
      - app

    # command: ["--spec", "cypress/e2e/app.cy.js", "--browser", "electron"]
    command: ["--spec", "cypress/e2e/${TEST_SPEC}.cy.js", "--browser", "electron"]

